name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [claude/smart-irrigation-android-6cp57w]
    paths: ['riego-inteligente/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['riego-inteligente/**', '.github/workflows/build-apk.yml']

# Un push nuevo a la misma rama reemplaza a la compilación anterior (solo interesa el último APK).
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: riego-inteligente

jobs:
  # Formato, lint, tipos y pruebas: nada se compila ni se publica si esto falla.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: riego-inteligente/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # La app compilada en un navegador real: los recorridos principales de las tres pantallas. Corre en paralelo
  # con el APK y no lo bloquea (si falla, queda a la vista en el resumen).
  e2e:
    needs: check
    # Playwright aún no soporta el Ubuntu más nuevo (el de `ubuntu-latest`): se fija una versión que sí.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: riego-inteligente/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  apk:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publica el Release con el APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: riego-inteligente/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Versión del APK (para el aviso de actualización)
        run: |
          printf "export const BUILD_INFO: { sha: string; run: number } = { sha: '%s', run: %s };\n" "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > src/app/core/build-info.ts
          cat src/app/core/build-info.ts
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: riego-inteligente/android
      - uses: actions/upload-artifact@v4
        with:
          name: riego-inteligente-debug-apk
          path: riego-inteligente/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar Release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk riego-inteligente.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest riego-inteligente.apk \
            --title "Riego Inteligente · build ${{ github.run_number }}" \
            --notes "build ${{ github.run_number }} · ${{ github.sha }}" \
            --target ${{ github.sha }} --prerelease
